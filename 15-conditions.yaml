- name: "Install Nginx"
  hosts: local
  become: true
  connection: local
  tasks:
  - name: "Install Nginx in RedHat"
    dnf: 
      name: nginx
      state: present
    when: ansible_facts.os_family == "RedHat"


  - name: "Install Nginx in debian"
    apt: 
      name: nginx
      state: present
    when: ansible_facts.os_family == "Debian"
    
    