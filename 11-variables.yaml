- name: "Print Ansible Facts"
  hosts: local
  connection: local
  tasks:
  - name: "Print Facts"
    debug:
      msg: "{{ansible_facts}}"

  
  - name: "Print Inside info From facts"
    debug: 
      msg: |
        private_ip: "{{ansible_facts['default_ipv4']['address']}}"
        os_family: "{{ansible_facts.os_family}}"
        private_ip: "{{ansible_facts.default_ipv4.address}}"
